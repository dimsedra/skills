<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{REPORT_TITLE}}</title>
  
  <!-- JetBrains Mono Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="report.css">
  
  <!-- Mermaid.js for diagrams (architecture, sequence, flowcharts) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  
  <!-- Chart.js for data visualization & metrics (bar, line, radar, pie) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0c0c0e',
        primaryColor: '#141417',
        primaryTextColor: '#f0f0f2',
        primaryBorderColor: '#222227',
        lineColor: '#8e8e99',
        secondaryColor: '#0c0c0e',
        tertiaryColor: '#050505',
        fontFamily: '"JetBrains Mono", ui-monospace, monospace'
      }
    });
  </script>
</head>
<body>
  <div class="container">
    
    <header>
      <div class="header-top">
        <div class="badge-group">
          {{BADGES_HTML}}
        </div>
        <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">[ LIGHT ]</button>
      </div>
      <h1>{{REPORT_TITLE}}</h1>
      <div class="meta-bar">
        <span><strong>DATE:</strong> {{DATE}}</span>
        <span><strong>CONTEXT:</strong> {{CONTEXT}}</span>
        {{EXTRA_META}}
      </div>
    </header>

    <main>
      {{CONTENT_BODY}}
    </main>

    <footer>
      <span>GENERATED BY AI ASSISTANT</span>
      <span>LOCAL DELIVERABLE</span>
    </footer>

  </div>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('report-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      updateToggleText(theme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('report-theme', newTheme);
      updateToggleText(newTheme);
    }

    function updateToggleText(theme) {
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.textContent = theme === 'dark' ? '[ LIGHT ]' : '[ DARK ]';
      }
    }

    initTheme();
  </script>
</body>
</html>
